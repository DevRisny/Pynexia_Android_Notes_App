name: Screenshots

# Runs the real app on an Android emulator and saves screenshots for the README.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "scripts/capture.py"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Pillow
        run: pip install pillow

      - name: Capture on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture.py docs/images

      - name: Keep the screenshots as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images

      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update app screenshots from the emulator"
          git pull --rebase origin main
          git push origin HEAD:main
