name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests and build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Inkwell-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK to the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Inkwell.apk
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "Inkwell 1.0.0" \
            --notes "Debug build of Inkwell, built automatically by GitHub Actions from main. Install on Android 7.0 or newer (allow installs from unknown sources)."
          gh release upload v1.0.0 Inkwell.apk --clobber
